<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<title>Kitchen Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, calm, readable from across the kitchen.
   IDEA: a kitchen wall clock beside a stack of recipe cards.
   PICTURE: the huge clock on a tomato-red panel; recipe cards fill the rest.
   COLOUR and TYPE: tomato red, white, mustard accent; Outfit numerals, Atkinson Hyperlegible text.
   LAYOUT: side panel (clock, weather, timers) + recipe area; stacks on narrow screens.
   Written in plain older CSS/JS so it runs on old iPads. */
:root{color-scheme:dark;--bg:#121110;--panel:#1b1917;--chip:#272320;--ink:#f2eee9;--soft:#a39b94;--line:#2f2b28;--card:#1e1b19;--red:#d4472f;--red2:#e8634b;--mus:#f2b632;--on:#f2eee9}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mus);outline-offset:2px}
.app{display:-webkit-flex;display:flex;height:100%}
.side{width:36%;max-width:440px;background:var(--panel);border-right:1px solid var(--line);color:var(--on);padding:28px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.clock{font-family:Outfit,Helvetica,sans-serif;font-weight:300;font-size:96px;line-height:1;letter-spacing:-2px;white-space:nowrap}
.clock small{font-size:28px;letter-spacing:0;margin-left:6px;font-weight:600}
.date{font-size:22px;margin-top:8px;font-weight:700;color:var(--mus)}
.side>*{-webkit-flex-shrink:0;flex-shrink:0}
.wx{display:block;width:100%;text-align:left;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--chip);color:var(--on);min-height:44px}
.wx b{color:#fff;font-family:Outfit,sans-serif;font-weight:600;font-size:40px;line-height:1}
.wx span{display:block;font-size:16px;opacity:.9}
.wx .now{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.wx .now svg{width:44px;height:44px;margin-right:10px;-webkit-flex:none;flex:none}
.fc{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:14px -6px 0;padding-top:12px;border-top:1px solid #3a3531}
.fc div{width:14.28%;text-align:center;padding:0 1px}
.fc i{display:block;font-style:normal;font-size:14px;font-weight:700;color:var(--soft)}
.fc svg{width:28px;height:28px;margin:4px 0 2px}
.fc b{display:block;font-family:Outfit,sans-serif;font-size:17px;font-weight:600;line-height:1.1;white-space:nowrap}
.fc em{display:block;font-style:normal;font-size:14px;color:var(--soft);white-space:nowrap}
.fc u{display:block;text-decoration:none;font-size:13px;font-weight:700;color:#7fb2e5;white-space:nowrap}
.fcn{font-size:13px;color:var(--soft);margin-top:8px}
@media (min-width:761px) and (max-width:900px){.fc div{width:25%;margin-bottom:8px}}
.side h2{font-family:Outfit,sans-serif;font-weight:600;font-size:22px;margin:20px 0 8px}
.presets{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-4px}
.presets button{margin:4px;min-width:56px;min-height:48px;padding:0 12px;border-radius:12px;background:var(--chip);color:var(--on);border:1px solid #3a3531;font-weight:700;font-size:18px}
.t{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--chip);border-left:4px solid var(--red2)}
.t .n{-webkit-flex:1;flex:1;font-size:15px;opacity:.9}
.t .v{font-family:Outfit,sans-serif;font-weight:600;font-size:34px;white-space:nowrap;margin-right:10px}
.t button{min-width:44px;min-height:44px;border-radius:10px;background:#3a3531;color:var(--on);font-weight:700}
.t.done{background:var(--mus);color:#1d1b1a;border-left-color:var(--mus);-webkit-animation:pulse 1s infinite;animation:pulse 1s infinite}
.t.done button{background:#1d1b1a;color:#fff;padding:0 14px}
@-webkit-keyframes pulse{50%{opacity:.6}}@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.t.done{-webkit-animation:none;animation:none}}
.empty{opacity:.8;font-size:15px;margin-top:10px}
.foot{margin-top:auto;padding-top:12px}
.foot button{color:var(--soft);text-decoration:underline;min-height:44px;font-size:15px;padding:0}
.main{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 30px 60px}
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:18px}
.bar h1{font-family:Outfit,sans-serif;font-weight:600;font-size:40px;line-height:1.05;margin:0 auto 8px 0;padding-right:12px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;margin:0 0 8px 8px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.cats{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-4px -4px 14px}
.cats button{margin:4px;min-height:44px;padding:0 16px;border-radius:22px;background:var(--chip);border:1px solid #3a3531;font-weight:700;font-size:16px}
.cats button.on{background:var(--red);border-color:var(--red);color:#fff}
.cats.sm{margin:6px -4px 0}.cats.sm button{min-height:40px;font-size:15px;padding:0 12px}
.search{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:18px;-webkit-appearance:none}
.cards{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-8px}
.card{width:calc(50% - 16px);margin:8px;text-align:left;padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:120px}
.card:active{border-color:var(--red2)}
.card{position:relative}
.card.pic{padding-left:126px;min-height:128px}
.thumb{position:absolute;left:14px;top:50%;margin-top:-50px;width:100px;height:100px;border-radius:12px;background:#2a2623 center/cover no-repeat;-webkit-background-size:cover;background-size:cover}
.hero{height:360px;max-width:420px;border-radius:16px;margin:14px 0 12px;background:#2a2623 center/cover no-repeat;-webkit-background-size:cover;background-size:cover}
@media (max-width:760px){.hero{height:300px;max-width:none}}
.card b{display:block;font-family:Outfit,sans-serif;font-weight:600;font-size:24px;line-height:1.15}
.card span{display:block;color:var(--soft);margin-top:6px;font-size:15px}
.note{color:var(--soft);font-size:14px;margin-top:20px}
.rv h1{font-family:Outfit,sans-serif;font-weight:600;font-size:44px;line-height:1.05;margin:6px 0 4px}
.meta{color:var(--soft);margin-bottom:20px}
.rv h2{font-family:Outfit,sans-serif;font-weight:600;font-size:26px;margin:24px 0 10px}
.ing{list-style:none;padding:0;margin:0}
.ing li button{display:block;width:100%;text-align:left;padding:10px 0 10px 42px;position:relative;min-height:48px;border-bottom:1px solid var(--line)}
.ing li button:before{content:"";position:absolute;left:4px;top:12px;width:24px;height:24px;border-radius:6px;border:2px solid var(--soft)}
.ing li.sub{font-family:Outfit,sans-serif;font-weight:600;font-size:19px;color:var(--mus);padding:18px 0 4px}
.ing li.sub:first-child{padding-top:2px}
.big .ing li.sub{font-size:25px}
.ing li.on button{color:var(--soft);text-decoration:line-through}
.ing li.on button:before{background:var(--red);border-color:var(--red)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;padding:14px 16px 14px 62px;position:relative;border-radius:14px;margin-bottom:8px;cursor:pointer}
.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);text-align:center;line-height:34px;font-weight:700}
.steps li.cur{background:var(--card);outline:3px solid var(--mus)}
.steps li.cur:before{background:var(--mus);border-color:var(--mus);color:#1d1b1a}
.steps li.past{color:var(--soft)}
.steps .tb{margin-top:8px;min-height:44px;padding:0 14px;border-radius:10px;background:var(--red);color:#fff;font-weight:700;font-size:16px}
.rn{color:var(--soft);margin:0 0 10px;max-width:70ch}
.big .ing,.big .steps,.big .rn{font-size:23px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:16px;z-index:9}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid #3a3531;color:var(--ink);border-radius:18px;padding:24px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h2{font-family:Outfit,sans-serif;font-weight:600;font-size:28px;margin:0 0 14px}
.sheet label{display:block;font-weight:700;margin:14px 0 6px}
.sheet input,.sheet textarea{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);-webkit-appearance:none}
.sheet textarea{min-height:130px}
.sheet .hint{color:var(--soft);font-size:14px;margin-top:4px}
.row{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:flex-end;justify-content:flex-end;margin-top:20px}
.seg button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);margin-right:6px;background:var(--card)}
.seg button.on{background:var(--red);color:#fff;border-color:var(--red)}
@media (max-width:760px){
 .app{display:block;height:auto}
 .side{width:auto;max-width:none;padding:22px 18px}
 .clock{font-size:72px}
 .main{padding:22px 18px 60px;overflow:visible}
 .card{width:calc(100% - 16px)}
 .bar h1,.rv h1{font-size:34px}
}
@media (min-width:1100px){.clock{font-size:120px}.card{width:calc(33.33% - 16px)}}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <button class="wx" id="wx" data-act="settings"><span>Weather loading…</span></button>
  <h2>Timers</h2>
  <div class="presets">
   <button data-act="timer" data-m="1">1m</button><button data-act="timer" data-m="3">3m</button><button data-act="timer" data-m="5">5m</button><button data-act="timer" data-m="10">10m</button><button data-act="timer" data-m="15">15m</button><button data-act="timer" data-m="30">30m</button><button data-act="custom">Other</button>
  </div>
  <div id="tlist"></div>
  <div class="foot"><button data-act="settings">Settings: town, °F/°C, clock</button></div>
 </aside>
 <main class="main" id="main"></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var SAMPLES=[
 {id:"s1",title:"Fluffy pancakes",time:"20 min",serves:"4",ing:["1 1/2 cups flour","3 1/2 tsp baking powder","1 tbsp sugar","1/4 tsp salt","1 1/4 cups milk","1 egg","3 tbsp melted butter"],steps:["Whisk the flour, baking powder, sugar and salt in a large bowl.","In another bowl, whisk the milk, egg and melted butter.","Pour the wet mix into the dry and stir until just combined. A few lumps are fine.","Let the batter rest for 5 minutes.","Heat a lightly oiled pan over medium heat. Pour 1/4 cup batter per pancake.","Cook about 2 minutes, until bubbles form, then flip and cook 1 minute more."]},
 {id:"s2",title:"Simple tomato pasta",time:"25 min",serves:"4",ing:["1 lb spaghetti","3 tbsp olive oil","3 cloves garlic, sliced","1 can (28 oz) crushed tomatoes","1 tsp salt","Fresh basil","Grated Parmesan"],steps:["Bring a large pot of salted water to a boil.","Warm the olive oil in a pan and cook the garlic for 1 minute, without browning.","Add the tomatoes and salt. Simmer for 15 minutes, stirring now and then.","Meanwhile cook the pasta for 10 minutes, or as the package says.","Drain the pasta, toss it with the sauce, and top with basil and Parmesan."]},
 {id:"s3",title:"Roast chicken",time:"1 hr 30 min",serves:"4",ing:["1 whole chicken (about 4 lb)","2 tbsp soft butter","1 lemon","4 cloves garlic","Salt and pepper","Fresh thyme"],steps:["Heat the oven to 425°F (220°C).","Pat the chicken dry. Rub all over with butter, salt and pepper.","Put the halved lemon, garlic and thyme inside the chicken.","Roast for 75 minutes, until the juices run clear.","Rest the chicken for 10 minutes before carving."]},
 {id:"s4",title:"Chocolate chip cookies",time:"30 min",serves:"24 cookies",ing:["1 cup soft butter","3/4 cup sugar","3/4 cup brown sugar","2 eggs","1 tsp vanilla","2 1/4 cups flour","1 tsp baking soda","1/2 tsp salt","2 cups chocolate chips"],steps:["Heat the oven to 375°F (190°C).","Beat the butter and both sugars until creamy. Beat in the eggs and vanilla.","Stir in the flour, baking soda and salt, then the chocolate chips.","Drop spoonfuls onto a baking sheet, 2 inches apart.","Bake for 10 minutes, until golden at the edges.","Cool on the sheet for 2 minutes, then move to a rack."]}
];
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var us=(navigator.language||"en-US").indexOf("US")>-1;
var S=load("kd.settings",{city:"",lat:null,lon:null,unit:us?"F":"C",h12:us});
/* Recipes come from two places:
   SHARED = recipes.json in the GitHub repo (added by Claude from photos; backed up)
   MINE   = recipes added or edited on this iPad (localStorage only)
   HIDE   = shared recipes removed on this iPad */
var MINE=load("kd.mine",null);
if(!MINE){MINE=[];var old=load("kd.recipes",null)||[];
 for(var oi=0;oi<old.length;oi++){var ok=true;
  for(var si=0;si<SAMPLES.length;si++)if(SAMPLES[si].id===old[oi].id&&JSON.stringify(SAMPLES[si])===JSON.stringify(old[oi]))ok=false;
  if(ok)MINE.push(old[oi])}
 save("kd.mine",MINE)}
var HIDE=load("kd.hidden",[]);
var SHARED=load("kd.shared",null)||[];
var R=[];
function isMine(id){for(var i=0;i<MINE.length;i++)if(MINE[i].id===id)return true;return false}
function isShared(id){for(var i=0;i<SHARED.length;i++)if(SHARED[i].id===id)return true;return false}
function merge(){var out=[],i;
 for(i=0;i<SHARED.length;i++){var s=SHARED[i];if(s&&s.id&&!isMine(s.id)&&HIDE.indexOf(s.id)<0)out.push(s)}
 R=out.concat(MINE)}
merge();
function loadCats(){get("categories.json?v="+Date.now(),function(j){if(j&&typeof j.length=="number"){CATLIST=j;save("kd.catlist",j);if(view.name=="list")render()}},function(){})}
function loadShared(){loadCats();get("recipes.json?v="+Date.now(),function(j){
 if(j&&typeof j.length=="number"){SHARED=j;save("kd.shared",j);merge();if(view.name=="list"||!find(view.id))render()}
},function(){})}
var view={name:"list",id:null,q:"",big:false,checked:{},cur:0};
var curCat=load("kd.cat","");
function hasCatAny(c){for(var i=0;i<R.length;i++)if(hasCat(R[i],c))return true;return false}
function catsOf(r){return r&&r.cats&&r.cats.length?r.cats:[]}
/* category list: categories.json in the repo (in display order), plus any extra used by recipes */
var CATLIST=load("kd.catlist",null)||["Breakfast"];
function allCats(){var seen={},out=[],extra=[],i,j;
 for(i=0;i<CATLIST.length;i++)if(!seen[CATLIST[i].toLowerCase()]){seen[CATLIST[i].toLowerCase()]=1;out.push(CATLIST[i])}
 for(i=0;i<R.length;i++){var c=catsOf(R[i]);for(j=0;j<c.length;j++)if(!seen[c[j].toLowerCase()]){seen[c[j].toLowerCase()]=1;extra.push(c[j])}}
 return out.concat(extra.sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1}))}
function hasCat(r,c){var x=catsOf(r);for(var i=0;i<x.length;i++)if(x[i].toLowerCase()==c.toLowerCase())return true;return false}
var timers=[],tid=1,actx=null;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function find(id){for(var i=0;i<R.length;i++)if(R[i].id===id)return R[i];return null}

/* clock */
function tick(){
 var d=new Date(),h=d.getHours(),m=pad(d.getMinutes()),t;
 if(S.h12){t=(h%12||12)+":"+m+"<small>"+(h<12?"AM":"PM")+"</small>"}else{t=pad(h)+":"+m}
 $("clock").innerHTML=t;
 $("date").textContent=DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate();
 drawTimers();
}

/* weather (Open-Meteo, no key needed) */
var WX={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorms",96:"Thunderstorms",99:"Thunderstorms"};
function get(url,ok,bad){try{var x=new XMLHttpRequest();x.open("GET",url,true);x.timeout=15000;x.onload=function(){if(x.status==200){try{ok(JSON.parse(x.responseText))}catch(e){bad()}}else bad()};x.onerror=bad;x.ontimeout=bad;x.send()}catch(e){bad()}}
/* small weather pictures, drawn as SVG so they work offline and on old iPads */
var CL='<path d="M7 19h10.5a4 4 0 0 0 .4-7.98A6 6 0 0 0 6.3 11.1 4 4 0 0 0 7 19z" fill="#c9c2bb"/>';
function icon(c){var sun='<circle cx="12" cy="12" r="4.5" fill="#f2b632"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="#f2b632" stroke-width="1.8" stroke-linecap="round"/>',b;
 if(c<=1)b=sun;
 else if(c==2)b='<g transform="translate(4 -3) scale(.75)">'+sun+'</g>'+CL;
 else if(c==3||c==45||c==48)b=CL;
 else if(c>=95)b='<g transform="translate(0 -3)">'+CL+'</g><path d="M12.5 15l-2.5 4h3l-2 4" stroke="#f2b632" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 else if((c>=71&&c<=77)||c==85||c==86)b='<g transform="translate(0 -3)">'+CL+'</g><circle cx="8.5" cy="20" r="1.2" fill="#fff"/><circle cx="12.5" cy="22" r="1.2" fill="#fff"/><circle cx="16.5" cy="20" r="1.2" fill="#fff"/>';
 else b='<g transform="translate(0 -3)">'+CL+'</g><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5" stroke="#7fb2e5" stroke-width="1.8" stroke-linecap="round"/>';
 return '<svg viewBox="0 0 24 24" aria-hidden="true">'+b+"</svg>"}
function weather(){
 var w=$("wx");
 if(S.lat==null){w.innerHTML="<span>Tap to set your town for the weather</span>";return}
 var u="https://api.open-meteo.com/v1/forecast?latitude="+S.lat+"&longitude="+S.lon+"&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=8"+(S.unit=="F"?"&temperature_unit=fahrenheit":"");
 get(u,function(j){
  var c=j.current,dl=j.daily;
  var h='<div class="now">'+icon(c.weather_code)+"<b>"+Math.round(c.temperature_2m)+"°"+S.unit+"</b></div><span>"+esc(WX[c.weather_code]||"")+" in "+esc(S.city)+"</span><span>Today: high "+Math.round(dl.temperature_2m_max[0])+"° · low "+Math.round(dl.temperature_2m_min[0])+"°</span>";
  h+='<div class="fc">';
  for(var i=1;i<dl.time.length&&i<=7;i++){var t=dl.time[i].split("-"),day=DAYS[new Date(+t[0],t[1]-1,+t[2]).getDay()].slice(0,3),pp=dl.precipitation_probability_max?dl.precipitation_probability_max[i]:null;
   h+="<div><i>"+day+"</i>"+icon(dl.weather_code[i])+"<b>"+Math.round(dl.temperature_2m_max[i])+"°</b><em>"+Math.round(dl.temperature_2m_min[i])+"°</em>"+(pp>=20?'<u title="Chance of rain or snow">'+pp+"%</u>":"")+"</div>"}
  w.innerHTML=h+'</div><div class="fcn">Blue % = chance of rain or snow</div>';
 },function(){w.innerHTML="<span>Weather is unavailable right now"+(S.city?" for "+esc(S.city):"")+"</span>"});
}

/* sound: started from a tap so iPad allows it */
function audio(){try{if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.resume)actx.resume()}catch(e){}}
function beep(){if(!actx)return;try{for(var i=0;i<3;i++){var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.3;o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.3,t);g.gain.setValueAtTime(0,t+0.18);o.start(t);o.stop(t+0.2)}}catch(e){}}

/* timers */
function addTimer(mins,label){audio();timers.push({id:tid++,end:Date.now()+mins*60000,label:label||(mins+" min timer"),done:false,lastBeep:0});drawTimers()}
function fmt(ms){var s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;return(h?h+":"+pad(m):m)+":"+pad(s)}
function drawTimers(){
 var now=Date.now(),h="";
 for(var i=0;i<timers.length;i++){var t=timers[i],left=t.end-now;
  if(left<=0&&!t.done)t.done=true;
  if(t.done&&now-t.lastBeep>2000){t.lastBeep=now;beep()}
  h+='<div class="t'+(t.done?" done":"")+'"><div class="n">'+esc(t.label)+'</div><div class="v">'+(t.done?"Done!":fmt(left))+'</div><button data-act="stop" data-id="'+t.id+'" aria-label="'+(t.done?"Dismiss":"Cancel")+' timer">'+(t.done?"OK":"✕")+"</button></div>"}
 $("tlist").innerHTML=h||'<div class="empty">Tap a time to start a timer. You can run several at once.</div>';
}

/* recipe screens */
function list(){
 var q=view.q.toLowerCase(),h='<div class="bar"><h1>Recipes</h1><button class="btn" data-act="new">+ Add recipe</button></div><input class="search" id="q" type="search" placeholder="Search recipes or ingredients" value="'+esc(view.q)+'">',c="",ac=allCats(),n=0;
 if(curCat){var okc=false,acl=allCats();for(var ai=0;ai<acl.length;ai++)if(acl[ai].toLowerCase()==curCat.toLowerCase())okc=true;if(!okc)curCat=""}
 if(ac.length){h+='<div class="cats" role="group" aria-label="Categories"><button data-act="cat" data-c="" class="'+(curCat?"":"on")+'">All</button>';
  for(var ci=0;ci<ac.length;ci++)h+='<button data-act="cat" data-c="'+esc(ac[ci])+'" class="'+(curCat.toLowerCase()==ac[ci].toLowerCase()?"on":"")+'">'+esc(ac[ci])+"</button>";
  h+="</div>"}
 var rs=R.slice().sort(function(a,b){return a.title.toLowerCase()<b.title.toLowerCase()?-1:1});
 for(var i=0;i<rs.length;i++){var r=rs[i];
  if(curCat&&!hasCat(r,curCat))continue;
  if(q&&(r.title+" "+r.ing.join(" ")+" "+catsOf(r).join(" ")).toLowerCase().indexOf(q)<0)continue;
  c+='<button class="card'+(r.img?" pic":"")+'" data-act="open" data-id="'+esc(r.id)+'">'+(r.img?'<i class="thumb" style="background-image:url(\''+esc(r.img)+'\')"></i>':"")+'<b>'+esc(r.title)+"</b><span>"+esc([r.time,r.serves?"Serves "+r.serves:"",isMine(r.id)?"On this iPad only":""].filter(Boolean).join(" · "))+"</span></button>"}
 h+='<div class="cards">'+(c||'<p class="note">'+(curCat&&!q&&!hasCatAny(curCat)?"No "+esc(curCat)+" recipes yet. Send Claude photos of some, or tap + Add recipe.":"No recipes match"+(curCat?" in "+esc(curCat):"")+".")+"</p>")+"</div>";
 h+='<p class="note">Recipes Claude adds from your photos appear here automatically and are backed up on GitHub. Recipes you add or edit on this iPad are saved on this iPad only.</p>';
 return h;
}
var MIN=/(\d+)(?:\s*(?:-|–|to)\s*\d+)?\s*(minutes?|mins?)\b/i;
function recipe(r){
 var h='<div class="bar"><button class="btn alt" data-act="back" style="margin-left:0">‹ All recipes</button><span style="margin-left:auto"></span><button class="btn alt" data-act="big">'+(view.big?"Smaller text":"Bigger text")+'</button><button class="btn alt" data-act="edit" data-id="'+esc(r.id)+'">Edit</button></div>';
 h+='<div class="rv'+(view.big?" big":"")+'"><h1>'+esc(r.title)+'</h1>'+(r.img?'<div class="hero" role="img" aria-label="Photo of '+esc(r.title)+'" style="background-image:url(\''+esc(r.img)+'\')"></div>':"")+'<div class="meta">'+esc([r.time,r.serves?"Serves "+r.serves:"",catsOf(r).join(", ")].filter(Boolean).join(" · "))+"</div>";
 h+='<h2>Ingredients</h2><ul class="ing">';
 for(var i=0;i<r.ing.length;i++){
  if(/:\s*$/.test(r.ing[i]))h+='<li class="sub">'+esc(r.ing[i].replace(/:\s*$/,""))+"</li>";
  else h+='<li class="'+(view.checked[i]?"on":"")+'"><button data-act="chk" data-i="'+i+'">'+esc(r.ing[i])+"</button></li>"}
 h+='</ul><h2>Steps</h2><p class="note" style="margin-top:-4px">Tap a step to mark where you are.</p><ol class="steps">';
 for(var j=0;j<r.steps.length;j++){var m=r.steps[j].match(MIN);
  h+='<li data-act="step" data-i="'+j+'" class="'+(j==view.cur?"cur":j<view.cur?"past":"")+'">'+esc(r.steps[j])+(m?'<br><button class="tb" data-act="timer" data-m="'+m[1]+'" data-l="'+esc(r.title+", step "+(j+1))+'">Start '+m[1]+" min timer</button>":"")+"</li>"}
 h+="</ol>";
 if(r.notes&&r.notes.length){h+="<h2>Notes</h2>";for(var k=0;k<r.notes.length;k++)h+='<p class="rn">'+esc(r.notes[k])+"</p>"}
 return h+"</div>";
}
function render(){
 var r=view.name=="recipe"?find(view.id):null;
 $("main").innerHTML=r?recipe(r):list();
 var q=$("q");if(q)q.oninput=function(){view.q=q.value;var p=q.selectionStart;render();var n=$("q");n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
}

/* sheets */
function openSheet(h){$("sheet").innerHTML=h;$("modal").hidden=false}
function closeSheet(){$("modal").hidden=true}
function form(r){
 r=r||{title:"",time:"",serves:"",ing:[],steps:[]};
 openSheet('<h2>'+(r.id?"Edit recipe":"Add a recipe")+'</h2><form id="f">'+(r.id?"":'<label for="fx">Paste a whole recipe (optional)</label><textarea id="fx" placeholder="Paste copied recipe text here, then tap the button below."></textarea><div class="row" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn alt" data-act="parse" style="margin-left:0">Fill in the form for me</button></div><div class="hint" id="fxm"></div>')+'<label for="ft">Name</label><input id="ft" required value="'+esc(r.title)+'"><label for="fm">Time</label><input id="fm" placeholder="e.g. 45 min" value="'+esc(r.time)+'"><label for="fs">Serves</label><input id="fs" value="'+esc(r.serves)+'"><label for="fc">Categories</label><input id="fc" value="'+esc(catsOf(r).join(", "))+'" placeholder="e.g. Breakfast, Italian"><div class="hint">Separate with commas.'+(allCats().length?" Tap to add:":"")+'</div><div class="cats sm">'+allCats().map(function(c){return '<button type="button" data-act="addcat" data-c="'+esc(c)+'">'+esc(c)+"</button>"}).join("")+'</div><label for="fi">Ingredients</label><textarea id="fi">'+esc(r.ing.join("\n"))+'</textarea><div class="hint">One ingredient per line. End a line with a colon (like "For the sauce:") to make it a heading.</div><label for="fp">Steps</label><textarea id="fp">'+esc(r.steps.join("\n"))+'</textarea><div class="hint">One step per line. Steps that mention minutes get a timer button.</div><div class="row">'+(r.id?'<button type="button" class="btn alt" data-act="del" data-id="'+esc(r.id)+'" style="margin-right:auto;margin-left:0">Delete</button>':"")+'<button type="button" class="btn alt" data-act="close">Cancel</button><button class="btn" type="submit">Save</button></div></form>');
 $("f").onsubmit=function(e){e.preventDefault();
  var lines=function(id){return $(id).value.split("\n").map(function(s){return s.trim()}).filter(Boolean)};
  var n={id:r.id||"r"+Date.now(),title:$("ft").value.trim()||"Untitled",time:$("fm").value.trim(),serves:$("fs").value.trim(),ing:lines("fi"),steps:lines("fp")};if(r.notes)n.notes=r.notes;if(r.img)n.img=r.img;
  var cs=$("fc").value.split(","),cats=[];for(var ci=0;ci<cs.length;ci++){var cc=cs[ci].replace(/\s+/g," ").trim();if(cc){cc=cc.charAt(0).toUpperCase()+cc.slice(1);if(cats.join("|").toLowerCase().split("|").indexOf(cc.toLowerCase())<0)cats.push(cc)}}
  if(cats.length)n.cats=cats;
  var f=false;for(var i=0;i<MINE.length;i++)if(MINE[i].id===n.id){MINE[i]=n;f=true}
  if(!f)MINE.push(n);save("kd.mine",MINE);merge();closeSheet();view={name:"recipe",id:n.id,q:"",big:view.big,checked:{},cur:0};render();
 };
}
function settings(){
 openSheet('<h2>Settings</h2><form id="g"><label for="gc">Your town or city (for weather)</label><input id="gc" value="'+esc(S.city)+'" placeholder="e.g. Portland">'+(navigator.geolocation?'<button type="button" class="btn alt" id="gloc" style="margin:10px 0 0">Use my current location</button>':"")+'<div class="hint" id="gmsg"></div><label>Temperature</label><div class="seg"><button type="button" data-u="F" class="'+(S.unit=="F"?"on":"")+'">°F</button><button type="button" data-u="C" class="'+(S.unit=="C"?"on":"")+'">°C</button></div><label>Clock</label><div class="seg"><button type="button" data-c="12" class="'+(S.h12?"on":"")+'">12-hour</button><button type="button" data-c="24" class="'+(S.h12?"":"on")+'">24-hour</button></div><label>Recipes</label><button type="button" class="btn alt" data-act="'+(HIDE.length?"unhide":"refresh")+'" style="margin-left:0">'+(HIDE.length?"Bring back "+HIDE.length+" removed recipe"+(HIDE.length>1?"s":""):"Check for new recipes now")+'</button><div class="row"><button type="button" class="btn alt" data-act="close">Cancel</button><button class="btn" type="submit">Save</button></div></form>');
 var unit=S.unit,h12=S.h12,bs=$("sheet").getElementsByTagName("button");
 for(var i=0;i<bs.length;i++)(function(b){if(b.getAttribute("data-u")||b.getAttribute("data-c"))b.onclick=function(){var sib=b.parentNode.children;for(var k=0;k<sib.length;k++)sib[k].className="";b.className="on";if(b.getAttribute("data-u"))unit=b.getAttribute("data-u");else h12=b.getAttribute("data-c")=="12"}})(bs[i]);
 var pend=null;
 if($("gloc"))$("gloc").onclick=function(){
  var msg=$("gmsg");msg.textContent="Finding your location… If the iPad asks, tap Allow.";
  navigator.geolocation.getCurrentPosition(function(pos){
   var la=Math.round(pos.coords.latitude*1000)/1000,lo=Math.round(pos.coords.longitude*1000)/1000;
   function use(name){pend={city:name,lat:la,lon:lo};$("gc").value=name;msg.textContent="Found you: "+name+". Tap Save.";}
   get("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude="+la+"&longitude="+lo,function(j){
    var n=j.city||j.locality||"";use(n?n+(j.principalSubdivision?", "+j.principalSubdivision:""):"Current location")},
    function(){use("Current location")});
  },function(err){
   msg.textContent=err&&err.code==1?"The iPad didn't allow location. To turn it on: Settings → Privacy → Location Services → Safari Websites → While Using the App. Or type your town above.":"Couldn't find your location. Check the Wi-Fi, or type your town above.";
  },{enableHighAccuracy:false,timeout:15000,maximumAge:3600000});
 };
 $("g").onsubmit=function(e){e.preventDefault();var c=$("gc").value.trim();
  function done(){S.unit=unit;S.h12=h12;save("kd.settings",S);closeSheet();tick();weather()}
  if(pend&&c==pend.city){S.city=pend.city;S.lat=pend.lat;S.lon=pend.lon;done();return}
  if(!c||c==S.city){done();return}
  $("gmsg").textContent="Looking up "+c+"…";
  get("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(c),function(j){
   if(!j.results||!j.results.length){$("gmsg").textContent="Couldn't find that place. Try just the town name.";return}
   var p=j.results[0];S.city=p.name+(p.admin1?", "+p.admin1:"");S.lat=p.latitude;S.lon=p.longitude;done();
  },function(){$("gmsg").textContent="Couldn't reach the weather service. Check the Wi-Fi and try again."});
 };
}
function custom(){
 openSheet('<h2>Custom timer</h2><form id="c"><label for="cm">Minutes</label><input id="cm" type="number" inputmode="decimal" min="0.1" step="any" value="20" required><label for="cl">Label (optional)</label><input id="cl" placeholder="e.g. Potatoes"><div class="row"><button type="button" class="btn alt" data-act="close">Cancel</button><button class="btn" type="submit">Start</button></div></form>');
 $("c").onsubmit=function(e){e.preventDefault();var m=parseFloat($("cm").value);if(m>0){addTimer(m,$("cl").value.trim()||null);closeSheet()}};
}

/* "Paste a whole recipe": split copied text into title, ingredients and steps */
function parseRecipe(txt){
 var L=txt.replace(/\r/g,"").split("\n").map(function(s){return s.replace(/\s+/g," ").trim()}).filter(Boolean);
 var o={title:"",time:"",serves:"",ing:[],steps:[]},rest=[],times={},i,m;
 var IH=/^(ingredients?|you('|’)?ll need|you will need|what you('|’)?ll need|shopping list)\s*:?$/i,
     SH=/^(method|directions?|instructions?|preparation|steps?|to make( it)?|how to make( it)?)\s*:?$/i,
     SV=/^(serves|servings?|makes|yields?)\s*:?\s*(.+)$/i,
     TM=/^(total time|time|ready in|takes|prep(aration)? time|cook(ing)? time)\s*:?\s*(.+)$/i,
     Q=/^([\d½¼¾⅓⅔⅛]|(pinch|dash|handful)\b)/i,
     BUL=/^[•\-\*·▪◦●]\s*/,NUM=/^(step\s*)?\d{1,2}\s*[.):]\s*/i;
 for(i=0;i<L.length;i++){var l=L[i];
  if(l.length<40&&(m=l.match(SV))){if(!o.serves)o.serves=m[2];continue}
  if(l.length<50&&(m=l.match(TM))){times[m[1].toLowerCase()]=m[m.length-1];continue}
  rest.push(l)}
 o.time=times["total time"]||times["ready in"]||times["time"]||times["takes"]||"";
 if(!o.time){var pt=null,ct=null;for(var k in times){if(/^prep/.test(k))pt=times[k];if(/^cook/.test(k))ct=times[k]}
  o.time=[pt?"Prep "+pt:"",ct?"Cook "+ct:""].filter(Boolean).join(" · ")}
 if(rest.length&&!IH.test(rest[0])&&!SH.test(rest[0]))o.title=rest.shift();
 var ii=-1,sj=-1,ingL=[],stepL=[];
 for(i=0;i<rest.length;i++){if(ii<0&&IH.test(rest[i]))ii=i;else if(sj<0&&SH.test(rest[i]))sj=i}
 function heur(ls,skipIntro){var a=0,j;
  if(skipIntro){a=-1;for(j=0;j<ls.length;j++)if(Q.test(ls[j])&&!NUM.test(ls[j])){a=j;break}if(a<0)return[[],ls]}
  for(j=a;j<ls.length;j++)if(ls[j].length>60||NUM.test(ls[j]))break;
  return[ls.slice(a,j),ls.slice(j)]}
 if(ii>=0&&sj>=0){ingL=rest.slice(ii+1,sj>ii?sj:rest.length);stepL=rest.slice(sj+1,ii>sj?ii:rest.length)}
 else if(sj>=0){ingL=heur(rest.slice(0,sj),true)[0];stepL=rest.slice(sj+1)}
 else if(ii>=0){var h1=heur(rest.slice(ii+1),false);ingL=h1[0];stepL=h1[1]}
 else{var h2=heur(rest,true);ingL=h2[0];stepL=h2[1]}
 for(i=0;i<ingL.length;i++){var g=ingL[i].replace(BUL,"");if(g)o.ing.push(g)}
 var numbered=false;for(i=0;i<stepL.length;i++)if(NUM.test(stepL[i])||BUL.test(stepL[i]))numbered=true;
 for(i=0;i<stepL.length;i++){var s=stepL[i].replace(BUL,""),isNew=NUM.test(s)||BUL.test(stepL[i]);s=s.replace(NUM,"");if(!s)continue;
  var n=o.steps.length,prev=n?o.steps[n-1]:"";
  if(isNew||!n||(!numbered&&/[.!?)]$/.test(prev)))o.steps.push(s);
  else if(/-$/.test(prev)&&/^[a-z]/.test(s))o.steps[n-1]=prev.slice(0,-1)+s;
  else o.steps[n-1]=prev+" "+s}
 return o;
}
function fillFromPaste(){var t=$("fx").value,msg=$("fxm");
 if(!t.trim()){msg.textContent="Paste some recipe text into the box first.";return}
 var o=parseRecipe(t);
 if(o.title)$("ft").value=o.title;if(o.time)$("fm").value=o.time;if(o.serves)$("fs").value=o.serves;
 $("fi").value=o.ing.join("\n");$("fp").value=o.steps.join("\n");
 msg.textContent="Found "+o.ing.length+" ingredient"+(o.ing.length==1?"":"s")+" and "+o.steps.length+" step"+(o.steps.length==1?"":"s")+". Check the boxes below, fix anything that looks off, then tap Save.";
}

/* one tap handler for everything */
document.addEventListener("click",function(e){
 var el=e.target;while(el&&el!==document&&!el.getAttribute("data-act"))el=el.parentNode;
 if(e.target.id=="modal"){closeSheet();return}
 if(!el||el===document)return;
 var a=el.getAttribute("data-act"),id=el.getAttribute("data-id");
 if(a=="timer"){e.stopPropagation();addTimer(parseFloat(el.getAttribute("data-m")),el.getAttribute("data-l"))}
 else if(a=="custom"){audio();custom()}
 else if(a=="stop"){timers=timers.filter(function(t){return t.id!=id});drawTimers()}
 else if(a=="settings")settings();
 else if(a=="close")closeSheet();
 else if(a=="cat"){curCat=el.getAttribute("data-c")||"";save("kd.cat",curCat);render()}
 else if(a=="addcat"){var f=$("fc"),v=el.getAttribute("data-c"),have=f.value.split(",").map(function(x){return x.trim().toLowerCase()});if(have.indexOf(v.toLowerCase())<0)f.value=(f.value.trim()?f.value.replace(/[,\s]+$/,"")+", ":"")+v}
 else if(a=="parse")fillFromPaste();
 else if(a=="unhide"){HIDE=[];save("kd.hidden",HIDE);merge();render();loadShared();closeSheet()}
 else if(a=="refresh"){loadShared();closeSheet()}
 else if(a=="new")form();
 else if(a=="edit")form(find(id));
 else if(a=="open"){view={name:"recipe",id:id,q:view.q,big:view.big,checked:{},cur:0};render();$("main").scrollTop=0;window.scrollTo(0,0)}
 else if(a=="back"){view.name="list";render()}
 else if(a=="big"){view.big=!view.big;render()}
 else if(a=="chk"){var i=el.getAttribute("data-i");view.checked[i]=!view.checked[i];render()}
 else if(a=="step"){view.cur=+el.getAttribute("data-i");render()}
 else if(a=="del"){if(el.getAttribute("data-sure")){MINE=MINE.filter(function(r){return r.id!=id});save("kd.mine",MINE);
  if(isShared(id)&&HIDE.indexOf(id)<0){HIDE.push(id);save("kd.hidden",HIDE)}merge();closeSheet();view.name="list";render()}else{el.setAttribute("data-sure","1");el.textContent="Tap again to delete"}}
},false);

/* self-update: version.txt in the repo holds the current version; when it differs from
   VERSION below, reload with a fresh address (skipping the iPad's saved copy).
   Waits while a timer is running, a recipe is open or a window is showing. */
var VERSION="2026-11-21k";
var pendingUpdate=null;
function busy(){return timers.length>0||view.name=="recipe"||!$("modal").hidden}
function applyUpdate(){
 if(!pendingUpdate||busy())return;
 try{if(sessionStorage.getItem("kd.tried")==pendingUpdate)return;sessionStorage.setItem("kd.tried",pendingUpdate)}catch(e){}
 location.replace(location.pathname+"?v="+encodeURIComponent(pendingUpdate));
}
function checkUpdate(){try{var x=new XMLHttpRequest();x.open("GET","version.txt?t="+Date.now(),true);
 x.onload=function(){var v=(x.responseText||"").replace(/\s+/g,"");if(x.status==200&&v&&v!=VERSION&&v.length<40){pendingUpdate=v;applyUpdate()}};
 x.send()}catch(e){}}
render();tick();setInterval(tick,500);weather();loadShared();checkUpdate();
setInterval(function(){weather();loadShared();checkUpdate()},30*60000);
setInterval(applyUpdate,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){checkUpdate();loadShared()}},false);
})();
</script>
